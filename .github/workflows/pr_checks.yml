name: CI
on:
  push:
    branches:
      - master
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  merge_group:
jobs:
  workflow-lint:
    name: Lint workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A workflow file has no compiler. A malformed one does not fail — it
      # simply never runs, so the coverage it was added to provide silently
      # does not exist. actionlint turns that into a visible error.
      #
      # The shellcheck integration is disabled: it reports pre-existing
      # info-level findings in unrelated workflows, which would make this job
      # red on arrival and therefore ignored. Shell scripts are linted directly
      # in the install-scripts workflow instead.
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color -shellcheck=

  build:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        goenv_native_ext: ["", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build goenv
        shell: bash
        run: make build
      - name: Run Unit Tests
        shell: bash
        run: |
          echo "Running tests with GOENV_NATIVE_EXT=${{ matrix.goenv_native_ext }}"
          make test 2>&1 | tee test_output.log
          test_exit_code=${PIPESTATUS[0]}
          if [ $test_exit_code -ne 0 ]; then
            echo "Tests failed with exit code $test_exit_code"
            echo "=== First 100 lines of output ==="
            head -100 test_output.log
            echo "=== Last 100 lines of output ==="
            tail -100 test_output.log
            echo "=== Searching for FAIL ==="
            grep -B 5 -A 5 "FAIL" test_output.log || true
            exit $test_exit_code
          fi
        env:
          GOENV_NATIVE_EXT: ${{ matrix.goenv_native_ext }}
